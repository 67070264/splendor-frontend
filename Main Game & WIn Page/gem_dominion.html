<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gem Dominion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="gem_dominion_style.css?v=3">
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <div class="crown">♛</div>
      <h1>Gem Dominion</h1>
      <small>MINE · TRADE · PRESTIGE</small>
    </div>
    <div class="top-actions">
      <span class="pill" id="turnPill"></span>
      <button class="icon-btn wide" onclick="if(confirm('เริ่มเกมใหม่?'))newGame()">⎋ ออกจากเกม</button>
    </div>
  </header>

  <div class="layout">
    <aside id="players"></aside>

    <main class="board">
      <div id="market"></div>
      <div class="noble-row">
        <div class="deck noble-deck"><b>ขุนนาง (Noble)</b><span id="nobleCount"></span></div>
        <div class="nobles" id="nobles"></div>
      </div>
      <div class="bank" id="tokens"></div>
    </main>

    <aside class="side">
      <section class="parch" id="me"></section>
      <section class="parch action" id="action"></section>
      <section class="parch log" id="log"></section>
    </aside>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="gem_dominion_script.js?v=3"></script>
<script src="gem_dust.js" data-scale="0.6"></script>
</body>
</html>
